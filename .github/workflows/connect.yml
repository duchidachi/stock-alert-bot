name: Telegram verbinden

# Wird nur von setup.sh gestartet, falls Telegram Bot-Anfragen von deinem
# Internetanschluss blockt. Der Runner wartet auf dein START im Bot und gibt
# Chat-ID + Bot-Namen NUR verschlüsselt aus (Schlüssel CONNECT_KEY kennt nur
# dein Mac während des Setups; danach wird er wieder gelöscht).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CONNECT_KEY: ${{ secrets.CONNECT_KEY }}
    steps:
      - name: Auf START warten
        run: |
          python3 - <<'EOF' > found.txt
          import json, os, time, urllib.request
          t = os.environ["TELEGRAM_BOT_TOKEN"]
          def api(m):
              with urllib.request.urlopen(f"https://api.telegram.org/bot{t}/{m}", timeout=30) as r:
                  return json.load(r)
          api("deleteWebhook")
          user = api("getMe")["result"]["username"]
          end = time.time() + 240
          while time.time() < end:
              r = api("getUpdates?timeout=20").get("result", [])
              ids = [u[k]["chat"]["id"] for u in r for k in ("message", "my_chat_member") if k in u]
              if ids:
                  print(f"{ids[-1]}|{user}", end="")
                  break
          EOF
          if [ -s found.txt ]; then
            echo "CONNECT:$(openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -a -A -pass env:CONNECT_KEY -in found.txt)"
          else
            echo "Kein START empfangen."; exit 1
          fi
      - name: Begrüßung senden
        run: |
          python3 - <<'EOF'
          import os, urllib.parse, urllib.request
          chat = open("found.txt").read().split("|")[0]
          data = urllib.parse.urlencode({"chat_id": chat, "text": "🔗 Verbunden! Gleich kommen Testnachricht und Probe-Alarm."}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage", data=data, timeout=30).read()
          print("Begrüßung gesendet.")
          EOF
